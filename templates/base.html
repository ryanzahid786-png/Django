<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Django Website{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f0f4f8;
            color: #2d3748;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        nav {
            background: #0c4b33;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
        }
        nav .logo { color: #fff; font-weight: bold; font-size: 20px; text-decoration: none; }
        nav a.nav-link { color: #b7e4c7; text-decoration: none; font-size: 15px; }
        nav a.nav-link:hover { color: #fff; }
        main { flex: 1; max-width: 760px; width: 100%; margin: 40px auto; padding: 0 20px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }
        h1 { color: #0c4b33; margin-bottom: 12px; }
        h2 { color: #1b6b4a; margin: 20px 0 10px; }
        p { line-height: 1.6; margin-bottom: 10px; }
        .btn {
            display: inline-block;
            background: #1b6b4a;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn:hover { background: #0c4b33; }
        footer {
            text-align: center;
            padding: 16px;
            color: #718096;
            font-size: 13px;
        }
        /* Todo page styles */
        form.add-form { display: flex; gap: 10px; margin-bottom: 20px; }
        form.add-form input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
        }
        form.add-form input:focus { outline: none; border-color: #1b6b4a; }
        ul.tasks { list-style: none; }
        ul.tasks li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        ul.tasks li.done .task-title { text-decoration: line-through; color: #a0aec0; }
        .task-title { flex: 1; font-size: 15px; }
        .task-actions a { font-size: 13px; text-decoration: none; margin-left: 10px; }
        .task-actions .done-link { color: #1b6b4a; }
        .task-actions .delete-link { color: #c53030; }
        .empty { color: #718096; font-style: italic; }
        code {
            background: #edf2f7;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav>
        <a class="logo" href="{% url 'home' %}">🐍 My Django Site</a>
        <a class="nav-link" href="{% url 'home' %}">Home</a>
        <a class="nav-link" href="{% url 'todo' %}">To-Do List</a>
        <a class="nav-link" href="{% url 'about' %}">About</a>
    </nav>
    <main>
        <div class="card">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>Made with Django 🎉 — Your first website is running!</footer>
</body>
</html>
